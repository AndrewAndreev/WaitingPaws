name: WaitingPaws
options:
  bundleIdPrefix: su.comrade
  # English is the base language (every device language other than Russian gets it), Russian is the second.
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
    # The Mac UI uses macOS 26 APIs (Liquid Glass, toolbar spacers, window launch behaviour).
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

packages:
  WaitingPawsCore:
    path: Packages/WaitingPawsCore
  # Updates of the direct-download Mac app (WaitingPaws-macOS-Direct only).
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.1

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Placeholders for builds from Xcode: a release gets its version, build and commit from its git tag
    # (Tools/release.sh passes them to xcodebuild), the same on iPhone, Mac and Windows. About shows "dev" here.
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "0"
    WP_GIT_COMMIT: dev
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 849CANCD26
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    GENERATE_INFOPLIST_FILE: NO
    # UI strings live in App/Resources/Localizable.xcstrings (keys are the Russian texts in the code).
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  WaitingPaws-iOS:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
      # The Live Activity's data, shared with the widget extension (ActivityKit: iPhone only, not in the Mac app).
      - path: App/Widgets/Shared
    dependencies:
      - package: WaitingPawsCore
      # A static library (gomobile): linked into the app binary. Embedding it would copy an empty stub with
      # MinimumOSVersion 100.0 into the bundle, which App Store Connect rejects (ITMS-90208).
      - framework: Frameworks/Go2RTC.xcframework
        embed: false
      # The training's Live Activity and Dynamic Island (embedded in PlugIns).
      - target: WaitingPaws-Widgets
    info:
      path: App/iOS/Info.plist
      properties:
        NSSupportsLiveActivities: true
        CFBundleDisplayName: Waiting Paws
        CFBundleName: Waiting Paws
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WPGitCommit: $(WP_GIT_COMMIT)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ru]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        # English here; Russian in App/Resources/InfoPlist.xcstrings.
        NSLocalNetworkUsageDescription: Waiting Paws connects to your camera and to Waiting Paws on your other devices over the local network.
        NSBonjourServices:
          - _waitingpaws._tcp
        NSPhotoLibraryAddUsageDescription: Waiting Paws saves training videos to your Photos library.
        # Plain HTTP only to the camera, the in-app go2rtc (127.0.0.1) and other devices on the LAN.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_NAME: WaitingPaws
        # One bundle id for iPhone and Mac: a single App Store record with Universal Purchase.
        PRODUCT_BUNDLE_IDENTIFIER: su.comrade.waitingpaws
        # iPhone only for now (iPad runs it in compatibility mode); iPad support can be added later,
        # but never removed once released.
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # The iPhone's widget extension: only the Live Activity of a running training (lock screen, Dynamic Island).
  # Its texts come from the app, already localized; it has no strings of its own.
  WaitingPaws-Widgets:
    type: app-extension
    platform: iOS
    sources:
      - path: App/Widgets/Extension
      - path: App/Widgets/Shared
      # The app's door icons («Вышли», «Вернулись»): on the step button and in the Dynamic Island. SwiftUI only.
      - path: App/Sources/Components/StepIcon.swift
    info:
      path: App/Widgets/Info.plist
      properties:
        CFBundleDisplayName: Waiting Paws
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ru]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: WaitingPawsWidgets
        PRODUCT_BUNDLE_IDENTIFIER: su.comrade.waitingpaws.widgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

  # The Mac App Store app (TestFlight, App Store): updates come from the App Store only.
  WaitingPaws-macOS:
    templates: [MacApp]
    entitlements:
      path: App/macOS/WaitingPaws.entitlements
    info:
      path: App/macOS/Info.plist

  # The same Mac app downloaded from GitHub: Developer ID, notarized, updates itself through Sparkle
  # (Tools/release.sh direct). Sparkle is linked only here: the App Store rejects an app with its own updater.
  WaitingPaws-macOS-Direct:
    templates: [MacApp]
    dependencies:
      - package: Sparkle
    entitlements:
      path: App/macOS/WaitingPaws-Direct.entitlements
      properties:
        # Sparkle's installer runs outside the sandbox and talks to the app over these two XPC names.
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
    info:
      path: App/macOS/Info-Direct.plist
      properties:
        SUFeedURL: $(WP_UPDATE_FEED_URL)
        # Settings → About «Тестовые сборки» (AppUpdater.nightly) checks this one instead.
        WPNightlyFeedURL: $(WP_UPDATE_NIGHTLY_FEED_URL)
        SUPublicEDKey: $(WP_UPDATE_PUBLIC_KEY)
        SUEnableInstallerLauncherService: true
        # Daily checks without Sparkle's "check automatically?" question; new versions download in the background and
        # install when the app quits (both can be turned off in Settings → About).
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
        SUVerifyUpdateBeforeExtraction: true
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WP_DIRECT
        # Required for notarization.
        ENABLE_HARDENED_RUNTIME: YES
        # The appcast of the latest published GitHub release: an update reaches people when its release is published
        # as Latest. Test builds point it elsewhere (WP_UPDATE_FEED_URL=… on the xcodebuild line).
        WP_UPDATE_FEED_URL: https://github.com/AndrewAndreev/WaitingPaws/releases/latest/download/appcast.xml
        # Nightly builds: the rolling pre-release «nightly»; its appcast lists the latest release too.
        WP_UPDATE_NIGHTLY_FEED_URL: https://github.com/AndrewAndreev/WaitingPaws/releases/download/nightly/appcast.xml
        # EdDSA public key of the update signatures; the private key is in the release Mac's login keychain
        # (Sparkle's generate_keys --account waitingpaws), never in the repository.
        WP_UPDATE_PUBLIC_KEY: 52ISgaJz9fxa9oiLgBTS4J+FOWATY8vRloUJRDijf94=

targetTemplates:
  MacApp:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: WaitingPawsCore
      # A static library (gomobile): linked into the app binary. Embedding it would copy an empty stub with
      # MinimumOSVersion 100.0 into the bundle, which App Store Connect rejects (ITMS-90208).
      - framework: Frameworks/Go2RTC.xcframework
        embed: false
    entitlements:
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.personal-information.photos-library: true
    info:
      properties:
        CFBundleDisplayName: Waiting Paws
        CFBundleName: Waiting Paws
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WPGitCommit: $(WP_GIT_COMMIT)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ru]
        LSApplicationCategoryType: public.app-category.lifestyle
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: © 2026 Andrew Andreev
        NSLocalNetworkUsageDescription: Waiting Paws connects to your camera and to Waiting Paws on your other devices over the local network.
        NSBonjourServices:
          - _waitingpaws._tcp
        NSPhotoLibraryAddUsageDescription: Waiting Paws saves training videos to your Photos library.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_NAME: WaitingPaws
        PRODUCT_BUNDLE_IDENTIFIER: su.comrade.waitingpaws
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Apple Development (automatic, team above) instead of ad-hoc: a stable signature keeps the
        # Local Network / firewall permissions across rebuilds.
        CODE_SIGN_IDENTITY: "Apple Development"

schemes:
  WaitingPaws-iOS:
    build:
      targets:
        WaitingPaws-iOS: all
    run:
      config: Debug
  WaitingPaws-macOS:
    build:
      targets:
        WaitingPaws-macOS: all
    run:
      config: Debug
  WaitingPaws-macOS-Direct:
    build:
      targets:
        WaitingPaws-macOS-Direct: all
    run:
      config: Debug
