name: WaitingPaws
options:
  bundleIdPrefix: su.comrade
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

packages:
  WaitingPawsCore:
    path: Packages/WaitingPawsCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 849CANCD26
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    GENERATE_INFOPLIST_FILE: NO

targets:
  WaitingPaws-iOS:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: WaitingPawsCore
      - framework: Frameworks/Go2RTC.xcframework
        embed: true
    info:
      path: App/iOS/Info.plist
      properties:
        CFBundleDisplayName: Waiting Paws
        CFBundleName: Waiting Paws
        CFBundleDevelopmentRegion: ru
        CFBundleLocalizations: [ru]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: Доступ к локальной сети нужен для подключения к камерам, серверу go2rtc и к Mac с Waiting Paws.
        NSBonjourServices:
          - _waitingpaws._tcp
        NSPhotoLibraryAddUsageDescription: Чтобы сохранять записи тренировок в Фото.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_NAME: WaitingPaws
        PRODUCT_BUNDLE_IDENTIFIER: su.comrade.waitingpaws
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  WaitingPaws-macOS:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: WaitingPawsCore
      - framework: Frameworks/Go2RTC.xcframework
        embed: true
    entitlements:
      path: App/macOS/WaitingPaws.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.personal-information.photos-library: true
    info:
      path: App/macOS/Info.plist
      properties:
        CFBundleDisplayName: Waiting Paws
        CFBundleName: Waiting Paws
        CFBundleDevelopmentRegion: ru
        CFBundleLocalizations: [ru]
        NSHumanReadableCopyright: ""
        NSLocalNetworkUsageDescription: Доступ к локальной сети нужен для подключения к камерам и к iPhone с Waiting Paws.
        NSBonjourServices:
          - _waitingpaws._tcp
        NSPhotoLibraryAddUsageDescription: Чтобы сохранять записи тренировок в Фото.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_NAME: WaitingPaws
        PRODUCT_BUNDLE_IDENTIFIER: su.comrade.waitingpaws.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_IDENTITY: "-"

schemes:
  WaitingPaws-iOS:
    build:
      targets:
        WaitingPaws-iOS: all
    run:
      config: Debug
  WaitingPaws-macOS:
    build:
      targets:
        WaitingPaws-macOS: all
    run:
      config: Debug
