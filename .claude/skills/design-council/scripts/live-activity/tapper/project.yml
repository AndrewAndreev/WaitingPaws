name: Tapper
options:
  bundleIdPrefix: test.tapper
  deploymentTarget:
    iOS: "17.0"
targets:
  TapperApp:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: test.tapper.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  TapperUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: TapperApp
    settings:
      base:
        TEST_TARGET_NAME: TapperApp
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: test.tapper.uitests
schemes:
  Tapper:
    build:
      targets:
        TapperApp: all
        TapperUITests: [test]
    test:
      targets: [TapperUITests]
