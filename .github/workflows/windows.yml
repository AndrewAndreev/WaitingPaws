# Windows app (Desktop/): tests on every push that touches it; on a release tag `v<major>.<minor>.<build>` (one tag for
# iPhone, Mac and Windows, made by Tools/release.sh) it builds the installer and the portable zip with the tag's version
# and attaches them to that tag's GitHub release (created as a draft if it does not exist yet).
name: Windows

on:
  push:
    branches: [main]
    paths: ['Desktop/**', 'GoMobile/**', 'Tools/strings/**', 'App/Resources/Legal/**', '.github/workflows/windows.yml']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Desktop
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: false

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Desktop/package-lock.json

      - name: Install
        run: npm ci

      # The version lives only in the tag: package.json keeps 0.0.0, which the app shows as "dev". The commit is taken
      # first, while the checkout is clean (electron.vite.config.ts reads WP_GIT_COMMIT).
      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "$GITHUB_REF_NAME is not v<major>.<minor>.<build>"; exit 1; }
          echo "WP_GIT_COMMIT=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
          npm version "$version" --no-git-tag-version --allow-same-version

      - name: go2rtc.exe (patched like GoMobile/build.sh)
        run: node scripts/build-go2rtc.mjs --test

      - name: Typecheck and tests
        run: |
          npm run typecheck
          npm test

      - name: Package
        run: npm run dist

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          files=(dist/*-Setup.exe dist/*-win-x64.zip dist/*-Setup.exe.blockmap dist/latest.yml)
          if gh release view "$tag" > /dev/null 2>&1; then
            # A release published with its files already (e.g. built locally) keeps them; this build stays an artifact.
            if [ "$(gh release view "$tag" --json assets --jq '.assets | length')" != "0" ]; then
              echo "The release already has its files; this build is kept as the workflow artifact."
              exit 0
            fi
          else
            gh release create "$tag" --draft --title "Waiting Paws ${tag#v} for Windows" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$tag" "${files[@]}" --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: waiting-paws-windows
          path: |
            Desktop/dist/*-Setup.exe
            Desktop/dist/*-win-x64.zip
          if-no-files-found: error
          # 241 MB per run: with the default 90 days, 16 runs filled the private repo's Actions storage and the
          # upload failed. A week is enough to try a build; releases keep their own files.
          retention-days: 7
