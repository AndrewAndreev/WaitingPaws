# Windows app (Desktop/): tests on every push that touches it; on a `windows-v*` tag it builds the installer and the
# portable zip and attaches them to that tag's GitHub release (created as a draft if it does not exist yet).
name: Windows

on:
  push:
    branches: [main]
    paths: ['Desktop/**', 'GoMobile/**', 'Tools/strings/**', 'App/Resources/Legal/**', '.github/workflows/windows.yml']
    tags: ['windows-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Desktop
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: false

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Desktop/package-lock.json

      - name: Install
        run: npm ci

      - name: go2rtc.exe (patched like GoMobile/build.sh)
        run: node scripts/build-go2rtc.mjs --test

      - name: Typecheck and tests
        run: |
          npm run typecheck
          npm test

      - name: Package
        run: npm run dist

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/windows-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          files=(dist/*-Setup.exe dist/*-win-x64.zip dist/*-Setup.exe.blockmap dist/latest.yml)
          if gh release view "$tag" > /dev/null 2>&1; then
            # A release published with its files already (e.g. built locally) keeps them; this build stays an artifact.
            if [ "$(gh release view "$tag" --json assets --jq '.assets | length')" != "0" ]; then
              echo "The release already has its files; this build is kept as the workflow artifact."
              exit 0
            fi
          else
            gh release create "$tag" --draft --title "Waiting Paws ${tag#windows-v} for Windows" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$tag" "${files[@]}" --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: waiting-paws-windows
          path: |
            Desktop/dist/*-Setup.exe
            Desktop/dist/*-win-x64.zip
          if-no-files-found: error
